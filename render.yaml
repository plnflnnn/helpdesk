# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the web service (API + built React app), the background job worker, and Postgres.
# Values marked `sync: false` are asked for once, when the Blueprint is first created.

envVarGroups:
  - name: helpdesk-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true

services:
  - type: web
    name: helpdesk
    runtime: node
    plan: starter
    # devDependencies (TypeScript, webpack, Prisma CLI, tsx) are needed to build, migrate and seed.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    # Applies migrations, then creates/updates the admin from ADMIN_* (safe to re-run; no demo data
    # in production).
    preDeployCommand: npm run db:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: helpdesk-shared
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      # APP_URL / BETTER_AUTH_URL default to this service's onrender.com URL. Set APP_URL when you
      # add a custom domain.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      # Generate with: openssl rand -hex 24 (hex, because it goes in the webhook URL)
      - key: SENDGRID_INBOUND_SECRET
        sync: false
      - key: SERVER_SENTRY_DSN
        sync: false
      # Read by webpack at build time and shipped in the public bundle.
      - key: CLIENT_SENTRY_DSN
        sync: false

  - type: worker
    name: helpdesk-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w shared && npm run build -w server
    startCommand: npm run start:worker
    envVars:
      - fromGroup: helpdesk-shared
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      # The web service's public URL, e.g. https://helpdesk.onrender.com (only validated here).
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SERVER_SENTRY_DSN
        sync: false

databases:
  - name: helpdesk-db
    databaseName: helpdesk
    postgresMajorVersion: '17'
    plan: basic-256mb
